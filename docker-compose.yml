# AVDP GIS Portal - Docker Compose stack
#
# Service layout follows geonode-project 5.1.x (GeoNode 5.1.1):
#   django + celery  -> GeoNode application and background workers (same image)
#   geonode (nginx)  -> public entry point; proxies /geoserver/ and serves statics
#   geoserver        -> OGC map server (only reachable through nginx)
#   data-dir-conf    -> seeds the GeoServer data directory on first start
#   db               -> PostgreSQL/PostGIS (internal only)
#   redis            -> Celery broker / result backend (internal only)
#   memcached        -> optional Django cache (internal only)
#   letsencrypt      -> optional; only started with the "https" profile
#
# Image versions are set in .env (see .env.example).

x-common-django:
  &default-common-django
  image: ${COMPOSE_PROJECT_NAME}/geonode:${GEONODE_BASE_IMAGE_VERSION}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    # - './src:/usr/src/project'  # Uncomment for live-editing project code (see docs/DEVELOPMENT.md)
    - statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    - backup-restore:/backup_restore
    - data:/data
    - tmp:/tmp
    # Read-only drop folder for demonstration packages (see docs/DATA_IMPORT.md)
    - ./data/demo:/usr/src/project/data/demo:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # GeoNode Django application (uWSGI).
  django:
    << : *default-common-django
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - GEONODE_BASE_IMAGE=${GEONODE_BASE_IMAGE}
    container_name: django4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://django:8000/"
      start_period: 120s
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      - IS_CELERY=False
    entrypoint: ["/usr/src/project/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/project/uwsgi.ini"

  # Celery worker that executes asynchronous tasks (uploads, thumbnails, harvesting).
  celery:
    << : *default-common-django
    container_name: celery4${COMPOSE_PROJECT_NAME}
    depends_on:
      django:
        condition: service_healthy
    environment:
      - IS_CELERY=True
    entrypoint: ["/usr/src/project/entrypoint.sh"]
    command: "celery-cmd"
    healthcheck:
      test: "celery -b $${BROKER_URL} inspect ping -t 10 || exit 1"
      start_period: 60s
      interval: 60s
      timeout: 20s
      retries: 3

  # Nginx: the only service published on the host.
  geonode:
    image: ${COMPOSE_PROJECT_NAME}/nginx:${NGINX_BASE_IMAGE_VERSION}
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${NGINX_BASE_IMAGE_VERSION}@${NGINX_BASE_IMAGE_DIGEST}
    container_name: nginx4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    environment:
      - RESOLVER=127.0.0.11
    ports:
      # HTTP_BIND defaults to 127.0.0.1 so a development stack is not reachable
      # from the network. Set HTTP_BIND=0.0.0.0 only on a server behind a firewall.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT}:80"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT}:443"
    volumes:
      - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics
    restart: unless-stopped
    healthcheck:
      test: "nc -z 127.0.0.1 80 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional Django cache (MEMCACHED_ENABLED in .env).
  memcached:
    image: ${MEMCACHED_IMAGE}
    container_name: memcached4${COMPOSE_PROJECT_NAME}
    command: memcached ${MEMCACHED_OPTIONS}
    restart: unless-stopped
    healthcheck:
      test: nc -z 127.0.0.1 11211
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Let's Encrypt certificates. Only needed for public HTTPS deployments:
  #   docker compose --profile https up -d
  letsencrypt:
    image: ${COMPOSE_PROJECT_NAME}/letsencrypt:${LETSENCRYPT_BASE_IMAGE_VERSION}
    profiles: ["https"]
    build:
      context: ./docker/letsencrypt
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${LETSENCRYPT_BASE_IMAGE_VERSION}
    container_name: letsencrypt4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    volumes:
      - nginx-certificates:/geonode-certificates
    restart: unless-stopped

  # GeoServer. Not published on the host; reached through nginx at /geoserver/.
  geoserver:
    image: ${COMPOSE_PROJECT_NAME}/geoserver:${GEOSERVER_BASE_IMAGE_VERSION}
    build:
      context: ./docker/geoserver
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${GEOSERVER_BASE_IMAGE_VERSION}@${GEOSERVER_BASE_IMAGE_DIGEST}
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://geoserver:8080/geoserver/ows"
      start_period: 90s
      interval: 60s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - data:/data
      - tmp:/tmp
    restart: unless-stopped
    depends_on:
      data-dir-conf:
        condition: service_healthy
      django:
        condition: service_healthy

  # Copies the GeoNode-flavoured GeoServer data directory into the volume on first start.
  data-dir-conf:
    image: ${COMPOSE_PROJECT_NAME}/geoserver_data:${GEOSERVER_DATA_BASE_IMAGE_VERSION}
    build:
      context: ./docker/geoserver_data
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${GEOSERVER_DATA_BASE_IMAGE_VERSION}@${GEOSERVER_DATA_BASE_IMAGE_DIGEST}
    container_name: gsconf4${COMPOSE_PROJECT_NAME}
    entrypoint: sleep infinity
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    restart: unless-stopped
    healthcheck:
      test: "test -n \"$$(ls -A /geoserver_data/data)\""
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL + PostGIS. Internal only.
  db:
    image: ${COMPOSE_PROJECT_NAME}/postgis:${POSTGRES_BASE_IMAGE_VERSION}
    build:
      context: ./docker/postgresql
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${POSTGRES_BASE_IMAGE_VERSION}@${POSTGRES_BASE_IMAGE_DIGEST}
    command: postgres -c "max_connections=${POSTGRESQL_MAX_CONNECTIONS}"
    container_name: db4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Do not publish 5432 on the host. For local SQL access use:
    #   docker compose exec db psql -U postgres

  # Redis: Celery broker and result backend. Internal only.
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis4${COMPOSE_PROJECT_NAME}
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  nginx-confd:
    name: ${COMPOSE_PROJECT_NAME}-nginxconfd
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME}-nginxcerts
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  dbdata:
    name: ${COMPOSE_PROJECT_NAME}-dbdata
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
  redisdata:
    name: ${COMPOSE_PROJECT_NAME}-redisdata

{% load i18n %}
<div class="gn-footer-placeholder"></div>
<footer class="gn-footer avdp-footer">
    <div class="avdp-footer-inner">
        <ul class="avdp-footer-links">
            <li><a href="/upload-guide/">{% trans "Data guide" %}</a></li>
            <li><a href="/about/">{% trans "About" %}</a></li>
            <li><a href="/help/">{% trans "Help" %}</a></li>
            <li><a href="/developer/">{% trans "Developers" %}</a></li>
        </ul>
        <span class="avdp-footer-meta">AVDP GIS Portal · {% trans "Powered by" %} <a href="https://geonode.org/">GeoNode</a></span>
    </div>
</footer>

<script>
    (function () {
        const footer = document.querySelector('.gn-footer');
        const footerPlaceholder = document.querySelector('.gn-footer-placeholder');
        function resize() {
            if (footerPlaceholder && footer) {
                footerPlaceholder.style.height = footer.clientHeight + 'px';
            }
        }
        window.addEventListener('resize', resize);
        window.addEventListener('DOMContentLoaded', resize);
        resize();
    })();
</script>

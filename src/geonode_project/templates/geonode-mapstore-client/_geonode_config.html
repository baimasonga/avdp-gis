{% extends 'geonode-mapstore-client/_geonode_config.html' %}
{% block override_local_config %}
<script>
    window.__GEONODE_CONFIG__.overrideLocalConfig = function(localConfig, _) {
        // AVDP: open the catalogue as a compact list (one row per resource,
        // like the list/table views of ArcGIS Online and GeoNetwork) with more
        // results per page. The grid/list button still lets each visitor
        // switch; their choice is remembered by the browser. On phones the
        // columns would be too narrow, so cards (one per row) stay the default.
        var narrow = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
        var catalogue = (localConfig.plugins && localConfig.plugins.catalogue) || [];
        catalogue.forEach(function (plugin) {
            if (plugin.name !== 'ResourcesGrid') { return; }
            plugin.cfg = plugin.cfg || {};
            plugin.cfg.defaultCardLayoutStyle = narrow ? 'grid' : 'list';
            plugin.cfg.pageSize = 24;
            plugin.cfg.metadata = plugin.cfg.metadata || {};
            plugin.cfg.metadata.list = [
                { path: 'title', width: 32, labelId: 'gnviewer.columnTitle' },
                { path: 'raw_abstract', width: 33, labelId: 'resourcesCatalog.columnDescription' },
                { path: 'resource_type', width: 10, labelId: 'gnviewer.type' },
                { path: 'created', width: 12, type: 'date', format: 'D MMM YYYY', labelId: 'resourcesCatalog.columnCreated', noDataLabelId: 'resourcesCatalog.emptyNA' },
                { path: 'owner.username', width: 13, labelId: 'gnviewer.columnOwner', icon: { glyph: 'user' }, image: { path: 'owner.avatar' }, noDataLabelId: 'resourcesCatalog.emptyUnknown' }
            ];
        });
        return localConfig;
    };
</script>
<script>
    // AVDP: show a persistent notice in the viewer when the open map, dataset or
    // document is synthetic demonstration content. The marker keyword is read
    // from the resource's own metadata through the GeoNode API, so the notice
    // follows the catalogue record rather than a hard-coded list.
    (function () {
        var MARKER = 'avdp-synthetic-demo';
        var NOTICE = 'SYNTHETIC DEMONSTRATION DATA — NOT OFFICIAL AVDP RECORDS.';
        var DETAIL = 'Invented locations and figures for testing only. District labels are illustrative; do not sum beneficiary counts across layers.';
        var cache = {};

        function banner() {
            var el = document.getElementById('avdp-synthetic-banner');
            if (!el) {
                el = document.createElement('div');
                el.id = 'avdp-synthetic-banner';
                el.setAttribute('role', 'status');
                el.className = 'avdp-synthetic-banner';
                el.innerHTML = '<strong></strong> <span></span> <a href="/upload-guide/#demo-data">Details</a>';
                el.querySelector('strong').textContent = NOTICE;
                el.querySelector('span').textContent = DETAIL;
                document.body.appendChild(el);
            }
            return el;
        }

        function update() {
            var match = /#\/(map|dataset|document|geostory|dashboard)\/(\d+)/.exec(window.location.hash || '');
            if (!match) { banner().style.display = 'none'; return; }
            var pk = match[2];
            var show = function (isDemo) { banner().style.display = isDemo ? 'block' : 'none'; };
            if (pk in cache) { show(cache[pk]); return; }
            fetch('/api/v2/resources/' + pk + '?include[]=keywords', { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    var keywords = (data && data.resource && data.resource.keywords) || [];
                    cache[pk] = keywords.some(function (k) { return k && (k.slug === MARKER || k.name === MARKER); });
                    show(cache[pk]);
                })
                .catch(function () { show(false); });
        }

        window.addEventListener('hashchange', update);
        window.addEventListener('DOMContentLoaded', update);
    })();
</script>
<script>
    // AVDP: on a dataset's map page, show the latest automatic data check
    // (avdp/quality.py) as a small note that opens a list of the issues.
    (function () {
        var LEVELS = { problem: 'Problem', warning: 'Warning', info: 'Note' };

        function box() {
            var el = document.getElementById('avdp-quality');
            if (!el) {
                el = document.createElement('div');
                el.id = 'avdp-quality';
                el.className = 'avdp-quality';
                el.innerHTML = '<button type="button" class="avdp-quality-chip" aria-expanded="false" aria-controls="avdp-quality-panel"><span class="avdp-quality-dot"></span><span class="avdp-quality-label"></span></button>' +
                    '<div class="avdp-quality-panel" id="avdp-quality-panel" hidden><p class="avdp-quality-head"></p><ul></ul><p class="avdp-quality-foot"></p></div>';
                var chip = el.querySelector('button');
                chip.addEventListener('click', function () {
                    var panel = el.querySelector('.avdp-quality-panel');
                    panel.hidden = !panel.hidden;
                    chip.setAttribute('aria-expanded', String(!panel.hidden));
                });
                document.body.appendChild(el);
            }
            return el;
        }

        function text(tag, cls, value) {
            var node = document.createElement(tag);
            if (cls) { node.className = cls; }
            node.textContent = value;
            return node;
        }

        function render(data) {
            var el = box();
            el.setAttribute('data-status', data.status);
            el.querySelector('.avdp-quality-label').textContent = data.status === 'ok' ? 'Data check: no issues' : 'Data check: ' + data.summary.replace(/ in \d+ features\.$/, '');
            el.querySelector('.avdp-quality-head').textContent = data.summary;
            var list = el.querySelector('ul');
            list.innerHTML = '';
            (data.issues || []).forEach(function (issue) {
                var li = document.createElement('li');
                li.className = 'avdp-quality-' + issue.level;
                li.appendChild(text('strong', '', LEVELS[issue.level] || issue.level));
                li.appendChild(text('span', '', ' ' + issue.message));
                if (issue.examples && issue.examples.length) {
                    li.appendChild(text('small', '', 'For example: ' + issue.examples.slice(0, 3).join('; ')));
                }
                list.appendChild(li);
            });
            var foot = el.querySelector('.avdp-quality-foot');
            foot.textContent = 'Checked ' + new Date(data.checked).toLocaleString() + '. Checks run after each upload. ';
            var link = document.createElement('a');
            link.href = '/avdp/history/' + data.resource + '/';
            link.textContent = 'Change history';
            foot.appendChild(link);
            el.querySelector('.avdp-quality-panel').hidden = true;
            el.querySelector('button').setAttribute('aria-expanded', 'false');
            el.style.display = 'block';
        }

        function update() {
            var el = document.getElementById('avdp-quality');
            var match = /#\/dataset\/(\d+)/.exec(window.location.hash || '');
            if (!match) { if (el) { el.style.display = 'none'; } return; }
            fetch('/avdp/quality/' + match[1] + '/', { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (data) { render(data); } else if (el) { el.style.display = 'none'; }
                })
                .catch(function () { if (el) { el.style.display = 'none'; } });
        }

        window.addEventListener('hashchange', update);
        window.addEventListener('DOMContentLoaded', update);
    })();
</script>
{% endblock %}

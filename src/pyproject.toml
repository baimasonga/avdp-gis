[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geonode_project"
version = "0.1.0"
description = "AVDP GIS Portal - GeoNode project"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["project", "geonode", "django"]

dependencies = [
    # Pinned to the latest stable GeoNode release; see docs/ARCHITECTURE.md
    "GeoNode==5.1.1",
]

[project.urls]
Homepage = "https://github.com/GeoNode/geonode-project"

[tool.setuptools]
include-package-data = true

# Correct package discovery layout
[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["**/thesauri/*.rdf"]
